# Proje web sitesini (site/ klasörü) GitHub Pages'e yayınlar.
# main dalında site/ değişince ya da elle (Actions → Run workflow) çalışır.
name: Proje web sitesi

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages, yüklenen site paketini listeleyebilmek için

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Sürümler birlikte güncellenmeli: eski upload-pages-artifact'in yüklediği
      # paketi yeni deploy-pages bulamıyor ("No artifacts named github-pages")
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
