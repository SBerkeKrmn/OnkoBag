# Proje web sitesini (site/ klasörü) GitHub Pages'e yayınlar.
# main dalında site/ değişince ya da elle (Actions → Run workflow) çalışır.
# GitHub'ın şablonundaki gibi iki iş: önce paket yüklenir (build), yayın işi
# (deploy) paket tamamlandıktan sonra başlar. Tek işte yapınca deploy-pages
# bazen yeni yüklenen paketi henüz göremiyor ("No artifacts named github-pages").
name: Proje web sitesi

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages, yüklenen site paketini listeleyebilmek için

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
