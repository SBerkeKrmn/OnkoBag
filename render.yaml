# Render Blueprint — OnkoBağ backend (Express + Socket.io) ve PostgreSQL.
# Render panelinde: New → Blueprint → bu depoyu seçin. Kurulum: docs/yayin.md
#
# - Gizli değerler (SMTP şifresi vb.) burada YOK; "sync: false" olanları Render
#   ilk kurulumda sorar ve yalnızca Render'da saklanır.
# - Görseller veritabanında tutulur (STORAGE_DRIVER=database); ücretsiz planda
#   disk kalıcı olmadığı için yeniden başlatmada kaybolmazlar.
# - Her açılışta migration'lar uygulanır ve seed (idempotent) çalışır.

services:
  - type: web
    name: onkobag-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node prisma/seed.js && node src/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: onkobag-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: database
      - key: CORS_ORIGIN
        value: "*"
      # Google OAuth istemci kimlikleri gizli değildir (uygulamanın içinde de bulunur)
      - key: GOOGLE_CLIENT_IDS
        value: 553852567872-gslo1prh3nqdg02lhf2nucdqtli7q2ge.apps.googleusercontent.com,553852567872-l029itvq165pm93qd4iloej1qkejr62q.apps.googleusercontent.com
      # Test döneminde Expo Go ile Apple girişi de kabul edilir; mağaza yayınında host.exp.Exponent kaldırılmalı
      - key: APPLE_AUDIENCES
        value: com.onkobag.app,host.exp.Exponent
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: onkobag-db
    plan: free
    region: frankfurt
    databaseName: onkobag
    user: onkobag
